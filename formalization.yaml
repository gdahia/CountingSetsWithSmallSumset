# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Counting sets with small sumset"
  description: >-
    Lean 4 formalization of Green's paper Counting sets with small sumset, and the clique
    number of random Cayley graphs. For a finite abelian group Γ, let S_k^m(Γ) be the family
    of the sets X in Γ with |X| = k whose restricted sumset X ∔ X = {x + y : x, y in X,
    x ≠ y} has m elements. The paper bounds |S_k^m(Γ)| for Γ = Z/NZ and Γ = F_2^n, through
    a bound for the number of Freiman isomorphism classes of sets with small restricted
    sumset in a vector space. It deduces that the Cayley sum graph of a random subset of
    Z/NZ almost surely has clique number at most 160 log_2 N, and that the Cayley graph of a
    random subset of F_2^n almost surely has clique number between C_1 n log_2 n and
    C_2 n log_2 n. The formalization proves these results with C_1 = 1/4 and C_2 = 308, both
    as limits and as explicit bounds on the number of exceptional sets, and proves
    Corollary 14: Green's Freiman dimension
    dim Hom_2(A, F) - 1 is the largest dimension of a Freiman isomorphic copy of A in F^d
    that is not contained in a proper affine subspace, and for sets of integers it equals
    Freiman's definition.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11P70", "11B13", "11B30", "05C80", "05C55"]

sources:
  - title: "Counting sets with small sumset, and the clique number of random Cayley graphs"
    authors:
      - "Ben Green"
    id: "https://arxiv.org/abs/math/0304183v2"
    type: "paper"
    location: "https://arxiv.org/abs/math/0304183v2"
    relationship: "formalizes"
    note: >-
      Combinatorica 25 (2005), 307–326. The version used is version 2 of the arXiv preprint,
      of 11 August 2003, read from its LaTeX source. The statements are numbered as in that
      version, where theorems, propositions, lemmas and corollaries share one counter; the
      numbers were not compared with those of the published version. Theorems 4, 5 and 6,
      which the paper cites, and Proposition 29, which it states without proof, are not
      formalized.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Dense sets without large sumsets"
    authors:
      - "Gabriel Dahia"
      - "João Pedro Marciano"
      - "Victor Souza"
    id: "https://arxiv.org/abs/2607.15269"
    type: "paper"
    location: "https://arxiv.org/abs/2607.15269"
    relationship: "background"
    note: >-
      Uses Proposition 18 and the count in the proof of Proposition 23 to count pairs of sets
      with a sumset of moderate size. The two counts of sets of natural numbers in the library
      that the paper of Green does not state, card_boundedFreimanDimSets and
      smallSumsetFreimanDimSets_ncard_le_of_class_cover, have the form needed there.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Mathlib has Freiman homomorphisms and isomorphisms (IsAddFreimanHom, IsAddFreimanIso),
      Module.finrank, vectorSpan and affine independence, the clique and independence numbers
      of a simple graph, the Cayley graph SimpleGraph.addCayley, which is the Cayley sum graph
      in F_2^n, and the Plünnecke–Ruzsa inequality, which is Theorem 24 of the paper and is
      used for Lemma 25. It has no restricted sumset, no Cayley sum graph, no space of Freiman
      homomorphisms and none of the results of the paper.
  - id: "https://github.com/gdahia/SumOfSetsInSeveralDimensions"
    relationship: "builds-on"
    note: >-
      A Lake dependency. It provides the affine dimension of a finite set (Finset.affineDim),
      Freiman's definition of the Freiman dimension (freimanDim), which Corollary 14 compares
      with Green's, and Freiman's lemma |A + A| ≥ (d + 1)|A| - d(d + 1)/2, from which Lemma 21
      is proved.

status:
  scope: >-
    Definition 3, Theorems 7, 8 and 9, Lemmas 10 to 13, Corollary 14, Propositions 15, 18, 19,
    23, 26 and 27, Lemmas 16, 17, 21, 22, 25 and 28, Corollary 20 and the computations of
    Section 7, with explicit thresholds. Theorem 24 is the Plünnecke–Ruzsa inequality of
    Mathlib. Theorems 4, 5 and 6 and Proposition 29 are not formalized. The library also
    proves two counts of sets of natural numbers that the paper does not state. The sorry
    counts refer to the library and Solution.lean; Challenge.lean has one placeholder for
    each of its thirteen statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["gpt-5.6 sol high", "claude opus 5"]
      framework: "Codex"
      tool_setup: >-
        Codex agents guided by an AGENTS.md, with Lean proofs checked in a pinned Lake
        environment.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        The first proofs of the results of Sections 3 and 4, written as part of the proof of
        Theorem 1.1 of Dense sets without large sumsets.
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: "Lean 4, Mathlib, shell, and the arXiv source of the paper."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        Instructions to restyle the proofs of Sections 3 and 4, to prove Corollary 14 with
        Green's definition of the Freiman dimension, to formalize the other results of the
        paper, and to restyle the statements, proofs and documentation after Gabriel Dahia's
        review of other repositories. Claude Code split the work among subagents, one for
        each part of the paper, and merged and restyled their proofs. A later session added
        the limit form of Theorem 7 and restyled the library again, with subagents for groups
        of files.
  spend_usd: "not tracked"
  notes: >-
    The first proofs of Sections 3 and 4 were written by Codex agents in
    DenseSetsWithoutLargeSumsets. Claude Code, directed by Gabriel Dahia, rewrote them for
    vector spaces over a field and wrote the rest of the library, Challenge.lean,
    Solution.lean, the README and this file.

fidelity:
  divergences: >-
    Thresholds. The paper states its results for sufficiently large parameters. Here the
    thresholds are explicit: k, t ≥ 2^9000 in Propositions 18, 23 (i) and 26 (i),
    log_2 N ≥ 2^9000 in Theorems 7 and 8, n ≥ 2^9000 in Theorem 9, |A| ≥ 16/ε^2 in
    Proposition 19, |A| ≥ 46656 in Corollary 20 and n ≥ 2^16 in Proposition 27. They are not
    optimized.

    Almost sure statements. Theorems 7 and 9 and Proposition 27 are stated as limits of
    proportions of sets, as in the paper, and also as explicit counts of the exceptional sets.
    In Theorem 7, at most 2^N / N sets A ⊆ Z/NZ have ω(G_A) > 160 log_2 N, and the limit is
    taken over the positive integers N. In Theorem 9, with N = 2^n, at most
    2^N / n + 2^N / N sets A ⊆ F_2^n have ω(G_A) < n log_2 n / 4 or ω(G_A) > 308 n log_2 n.
    In Proposition 27, at most 2^N / n sets have ω(G_A) < n log_2 n / 4.

    Theorem 8. The paper asks for no clique or independent set of size 160 log_2 N. The Lean
    statement has clique number and independence number at most 160 log_2 N.

    Cayley graphs on F_2^n. The paper uses the Cayley sum graph on F_2^n. The Lean statements
    use Mathlib's SimpleGraph.addCayley, which is the same graph because x + y = y - x there
    (cayleySumGraph_eq_addCayley). On Z/NZ the two graphs differ, and the statements use
    cayleySumGraph.

    Corollary 14. The condition that a subset S of F^d is not contained in a proper affine
    subspace is stated as finrank F (vectorSpan F S) = d, and the corollary as IsGreatest.
    For a finite set X of integers, Challenge.lean states r_Q(X) = freimanDim X, where
    freimanDim is Freiman's dimension of SumOfSetsInSeveralDimensions, defined with the
    affine dimension over R of the image in R^d of a model in Q^d.

    Lemma 13. The paper gives dim Hom_2(A, W') as (r_F(A) + 1)^(dim W'). The correct value,
    proved here as finrank_freimanHomSpace, is (r_F(A) + 1) dim W'.

    Proposition 15 holds for every m ≥ t with |A ∔ A| ≤ m, in a commutative monoid with
    cancellation. A sum with at least Q representations has at least ⌊Q/2⌋ disjoint ones,
    where the paper uses Q/3.

    Lemmas 16 and 17. The orders of the isomorphisms are 4 and 8 in place of 3 and 6, and
    Lemma 16 has the bound (1 + l^4)^((t + 1)^4) in place of l^(3 t^4).

    Proposition 18. The number of isomorphism classes is bounded through a family of sets
    that contains a member of each class. The members of the family need not have small
    restricted sumset, and two of them may be isomorphic.

    Proposition 19. The paper picks the elements of B independently at random and uses a
    Chernoff bound. Here B has exactly ⌈2√k / ε⌉ elements, and averaging over all subsets of
    this size bounds the number of nondegenerate summing quadruples of some B. This gives
    the stronger bound |B| ≤ 3√k / ε.

    Lemma 21 is stated with Freiman's dimension and proved from Freiman's lemma for the full
    sumset, applied to a model of S in Q^r ⊆ R^r, and |S + S| ≤ |S ∔ S| + |S|.

    Lemma 22. The lift of A ⊆ Z/NZ is {a.val + 1 : a ∈ A} ⊆ {1, ..., N}.

    Lemma 25. The paper takes X ⊆ A maximal such that the sums of h distinct elements of X
    are distinct, and argues that each a ∈ A \ X lies in hX - (h - 1)X. This step needs one
    of two colliding sums of X ∪ {a} to avoid a, which the paper does not justify. Here
    h = ⌊log_2 k⌋, and X is an affinely independent subset of a Freiman isomorphic copy of A
    with the same affine span, so that its sums of h distinct elements are distinct.

    Section 7. For F_2^n the sum over j is taken over j ≥ 38 n log_2 n.

    Counts not in the paper. card_boundedFreimanDimSets and
    smallSumsetFreimanDimSets_ncard_le_of_class_cover count subsets of {1, ..., n} of given
    size and bounded Freiman dimension, the second with |X + X| ≤ s. They combine Lemma 11
    or Proposition 18 with the bound n^(r + 1) for the members of an isomorphism class in
    {1, ..., n}, as the proof of Proposition 23 does.

