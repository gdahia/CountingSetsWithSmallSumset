name = "CountingSetsWithSmallSumset"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CountingSetsWithSmallSumset", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Source of the affine dimension of a finite set and of the Freiman dimension.
[[require]]
name = "SumOfSetsInSeveralDimensions"
git = "https://github.com/gdahia/SumOfSetsInSeveralDimensions"
rev = "24fcd0e57388a656c971fb54d47881123bc35128"

# Last, so that its pins of the shared dependencies take precedence on `lake update`.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

# The proof development; `Solution.lean` imports it.
[[lean_lib]]
name = "CountingSetsWithSmallSumset"

# The statement-only surface a reader audits. Not a default target, so that `lake build` does not
# build its `sorry`s; the comparator job builds it by name.
[[lean_lib]]
name = "Challenge"
roots = ["CountingSetsWithSmallSumsetPalomar.Challenge"]

# Proves the declarations stated in `Challenge.lean`; Comparator checks the two agree.
[[lean_lib]]
name = "Solution"
roots = ["CountingSetsWithSmallSumsetPalomar.Solution"]
